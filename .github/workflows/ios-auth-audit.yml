name: Audit iOS authentication runtime
on:
  workflow_dispatch:
  push:
    branches: [ios-livecontainer]
    paths: ['.github/workflows/ios-auth-audit.yml', 'ios/tests/prepare_audit_jit.py', 'third_party/ipatool/internal/sap/machine/qingzhou_differential_test.go']
permissions:
  contents: read
jobs:
  audit:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: authbridge/go.sum
      - uses: actions/cache/restore@v4
        with:
          path: |
            ios/build/unicorn-host
            ios/build/unicorn-tci
          key: unicorn-tci-a53ddc9-ios-arm64-v1
      - name: Prepare pinned interpreter and official JIT for comparison
        run: |
          TCI_HOST_ONLY=1 bash ios/build-tci.sh
          python3 ios/tests/prepare_audit_jit.py
      - name: Compare anonymous SAP handshake and signature bytes
        working-directory: third_party/ipatool
        env:
          QZ_TCI_LIBRARY: ${{ github.workspace }}/ios/build/unicorn-host/libunicorn.2.dylib
          QZ_AUDIT_JIT_LIBRARY: ${{ github.workspace }}/ios/build/unicorn-audit-jit/libunicorn.2.dylib
        run: go test -tags=qz_tci ./internal/sap/machine -run '^TestQingzhouSAPInterpreterDifferential$' -v -count=1 -timeout=15m
