name: Audit iOS authentication runtime
on:
  workflow_dispatch:
  push:
    branches: [ios-livecontainer]
    paths: ['.github/workflows/ios-auth-audit.yml', 'third_party/ipatool/**']
permissions:
  contents: read
jobs:
  audit:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: authbridge/go.sum
      - uses: actions/cache/restore@v4
        with:
          path: |
            ios/build/unicorn-host
            ios/build/unicorn-tci
          key: unicorn-tci-a53ddc9-guest-arm64-v2
      - name: Prepare current Store runtime
        run: TCI_HOST_ONLY=1 bash ios/build-tci.sh
      - name: Validate upstream authentication, query and download adapters
        working-directory: third_party/ipatool
        env:
          QZ_TCI_LIBRARY: ${{ github.workspace }}/ios/build/unicorn-host/libunicorn.2.dylib
        run: go test -tags=qz_tci ./internal/sap/unicorn ./internal/sap/machine ./internal/sap ./internal/store/profile ./internal/store/emulator ./internal/store ./pkg/http ./pkg/appstore -count=1 -timeout=30m
