name: Build iOS IPA
on:
  workflow_dispatch:
  push:
    branches: [ios-livecontainer]
    paths: ['ios/**', 'authbridge/**', 'third_party/ipatool/**', '.github/workflows/ios.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: authbridge/go.sum
      - uses: actions/cache/restore@v4
        id: unicorn-cache
        with:
          path: |
            ios/build/unicorn-host
            ios/build/unicorn-tci
          key: unicorn-tci-a53ddc9-ios-arm64-v1
      - name: Verify native authentication transport
        run: python3 ios/tests/test_native_http.py
      - name: Build no-JIT interpreter runtimes
        run: bash ios/build-tci.sh
      - uses: actions/cache/save@v4
        if: steps.unicorn-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ios/build/unicorn-host
            ios/build/unicorn-tci
          key: unicorn-tci-a53ddc9-ios-arm64-v1
      - name: Verify interpreter authentication without an Apple account
        working-directory: third_party/ipatool
        env:
          QZ_TCI_LIBRARY: ${{ github.workspace }}/ios/build/unicorn-host/libunicorn.2.dylib
        run: go test -tags=qz_tci ./internal/sap/unicorn ./internal/sap/machine ./internal/sap -count=1 -timeout=15m
      - name: Build arm64 IPA
        run: bash ios/build-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Qingzhou-IPA-iOS-0.2.4-NoJIT-arm64
          path: dist/*.ipa
          if-no-files-found: error
          retention-days: 14
