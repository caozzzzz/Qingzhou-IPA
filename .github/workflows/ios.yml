name: Build iOS IPA
on:
  workflow_dispatch:
  push:
    branches: [ios-livecontainer]
    paths: ['ios/**', 'authbridge/**', '.github/workflows/ios.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: authbridge/go.sum
      - name: Build arm64 IPA
        run: bash ios/build-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Qingzhou-IPA-iOS-0.1.0-arm64
          path: dist/*.ipa
          if-no-files-found: error
          retention-days: 14
